apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: networks.gcp.platform.upbound.io
spec:
  scope: Namespaced
  group: gcp.platform.upbound.io
  names:
    kind: Network
    plural: networks
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  description: Network Parameters
                  properties:
                    id:
                      type: string
                      description: ID of this Network that other objects will use to refer to it.
                    region:
                      type: string
                      description: Region is the region you'd like your resource to be created in.
                    externalNames:
                      description: >-
                        Optional map of krm.kcl.dev/composition-resource-name
                        ("network", "subnetwork") to crossplane.io/external-name,
                        for adopting an existing GCP object whose name does not
                        follow from id. Values must be non-empty. WARNING:
                        unlike naming, this annotation IS applied to composed
                        resources that already exist, so pointing it at one
                        Crossplane already manages repoints it at a different
                        GCP object and leaks the original.
                      type: object
                      additionalProperties:
                        type: string
                        minLength: 1
                    naming:
                      description: >-
                        How composed resources are named. Generated (the
                        default) lets Crossplane assign {xr-name}-{random};
                        Deterministic names the subnetwork from id, making it
                        adoptable. The network is named from id in either mode.
                        Applies to newly created resources only: Crossplane
                        keeps the name it already assigned, so this does not
                        make an existing deployment adoptable.
                      type: string
                      enum:
                        - Generated
                        - Deterministic
                      default: Generated
                    managementPolicies:
                      description: ManagementPolicies for the resources. Defaults to ["*"] which includes all operations.
                      type: array
                      items:
                        type: string
                        enum:
                          - "*"
                          - Create
                          - Observe
                          - Update
                          - Delete
                          - LateInitialize
                      default: ["*"]
                    providerConfigName:
                      description: Crossplane ProviderConfig to use for provisioning this resources
                      type: string
                      default: default
                  required:
                    - managementPolicies
                    - providerConfigName
                    - id
                    - region
                  type: object
              required:
                - parameters
