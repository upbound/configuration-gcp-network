apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: networks.gcp.platform.upbound.io
spec:
  scope: Namespaced
  group: gcp.platform.upbound.io
  names:
    kind: Network
    plural: networks
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  description: Network Parameters
                  properties:
                    id:
                      type: string
                      description: ID of this Network that other objects will use to refer to it.
                    region:
                      type: string
                      description: Region is the region you'd like your resource to be created in.
                    externalNames:
                      description: >-
                        Optional map of composition-resource-name to
                        crossplane.io/external-name, used to adopt existing GCP
                        resources instead of creating new ones. Both resources
                        this configuration composes are name-as-identifier
                        types. The subnetwork is named from id only when naming
                        is Deterministic, which is usually the better answer for
                        it; the network is named from id in either mode. This
                        map is for adopting an object whose GCP name does not
                        follow from id. Keys are the
                        krm.kcl.dev/composition-resource-name values ("network",
                        "subnetwork"), and values must be non-empty; an empty
                        value adopts nothing and falls back to the generated
                        resource name. Resources not listed are unaffected.
                        WARNING: unlike naming, this annotation IS applied to
                        composed resources that already exist, so pointing it at
                        a resource Crossplane already manages repoints that
                        managed resource at a different GCP object and leaks the
                        original. Omit this field for normal use.
                      type: object
                      additionalProperties:
                        type: string
                        minLength: 1
                    naming:
                      description: >-
                        How composed resources are named. Generated (the
                        default) lets Crossplane assign {xr-name}-{random}.
                        Deterministic derives the name from id, which makes the
                        subnetwork adoptable by a control plane that holds no
                        prior state about it, because its GCP identifier is its
                        Kubernetes name. The network is always named from id and
                        is unaffected by this field. Deterministic applies to
                        newly created composed resources only: Crossplane
                        restores the name it already assigned to any composed
                        resource that already exists, so existing resources are
                        neither renamed nor replaced, and flipping this flag
                        does not make an existing deployment adoptable.
                      type: string
                      enum:
                        - Generated
                        - Deterministic
                      default: Generated
                    managementPolicies:
                      description: ManagementPolicies for the resources. Defaults to ["*"] which includes all operations.
                      type: array
                      items:
                        type: string
                        enum:
                          - "*"
                          - Create
                          - Observe
                          - Update
                          - Delete
                          - LateInitialize
                      default: ["*"]
                    providerConfigName:
                      description: Crossplane ProviderConfig to use for provisioning this resources
                      type: string
                      default: default
                  required:
                    - managementPolicies
                    - providerConfigName
                    - id
                    - region
                  type: object
              required:
                - parameters
