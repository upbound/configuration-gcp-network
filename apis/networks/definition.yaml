apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: networks.gcp.platform.upbound.io
spec:
  scope: Namespaced
  group: gcp.platform.upbound.io
  names:
    kind: Network
    plural: networks
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  description: Network Parameters
                  properties:
                    id:
                      type: string
                      description: >-
                        ID of this Network that other objects will use to refer
                        to it. Composed resources are named from it, so it must
                        be at most 52 characters (the subnetwork is named
                        "{id}-subnetwork" against a 63-character cap), lowercase
                        letters, numbers and hyphens, starting with a letter and
                        ending with a letter or number.
                    region:
                      type: string
                      description: Region is the region you'd like your resource to be created in.
                    externalNames:
                      description: >-
                        Optional map of crossplane.io/composition-resource-name
                        ("network", "subnetwork") to crossplane.io/external-name,
                        for adopting an existing GCP object whose name does not
                        follow from id. Values must be non-empty. WARNING: this
                        annotation IS applied to composed resources that already
                        exist, so pointing it at one Crossplane already manages
                        repoints it at a different GCP object and leaks the
                        original.
                      type: object
                      additionalProperties:
                        type: string
                        minLength: 1
                    managementPolicies:
                      description: ManagementPolicies for the resources. Defaults to ["*"] which includes all operations.
                      type: array
                      items:
                        type: string
                        enum:
                          - "*"
                          - Create
                          - Observe
                          - Update
                          - Delete
                          - LateInitialize
                      default: ["*"]
                    providerConfigName:
                      description: Crossplane ProviderConfig to use for provisioning this resources
                      type: string
                      default: default
                  required:
                    - managementPolicies
                    - providerConfigName
                    - id
                    - region
                  type: object
              required:
                - parameters
            status:
              description: >-
                What this Network publishes for other domains to consume. Read
                these fields, rather than selecting this Network's composed
                resources, to place a cluster or a database in it.
              type: object
              properties:
                vpc:
                  description: >-
                    The VPC network. Named vpc rather than network so that
                    code generated from this schema keeps Network for the XR
                    itself.
                  type: object
                  properties:
                    name:
                      description: >-
                        GCP name of the network: externalNames.network if set,
                        otherwise spec.parameters.id. Set from the first
                        reconcile.
                      type: string
                    id:
                      description: >-
                        GCP ID of the network, in the form
                        projects/{project}/global/networks/{name}. Set once the
                        network exists in GCP.
                      type: string
                    selfLink:
                      description: >-
                        URI of the network. Set once the network exists in GCP;
                        wait for it before using the network.
                      type: string
                subnetwork:
                  description: The regional subnetwork, with GKE's secondary ranges.
                  type: object
                  properties:
                    name:
                      description: >-
                        GCP name of the subnetwork: externalNames.subnetwork if
                        set, otherwise "{id}-subnetwork". Set from the first
                        reconcile.
                      type: string
                    region:
                      description: Region of the subnetwork, spec.parameters.region.
                      type: string
                    ipCidrRange:
                      description: Primary IPv4 range of the subnetwork.
                      type: string
                    id:
                      description: >-
                        GCP ID of the subnetwork, in the form
                        projects/{project}/regions/{region}/subnetworks/{name}.
                        Set once the subnetwork exists in GCP.
                      type: string
                    selfLink:
                      description: >-
                        URI of the subnetwork. Set once the subnetwork exists in
                        GCP; wait for it before using the subnetwork.
                      type: string
                    secondaryRanges:
                      description: >-
                        Names of the subnetwork's secondary ranges, for a GKE
                        cluster's IP allocation policy.
                      type: object
                      properties:
                        pods:
                          description: Name of the secondary range for Pod IPs.
                          type: string
                        services:
                          description: Name of the secondary range for Service IPs.
                          type: string
